# Telugu Market Pulse (తెలుగు మార్కెట్ పల్స్) - Stock Market News Sources
#
# Each [[source]] is one verified, active financial feed or API.
# Fields:
#   id         stable snake_case id
#   name       display name
#   url        RSS/Atom feed URL
#   homepage   source homepage
#   category   indian_markets | stocks_in_news | global_markets | fii_dii | commodities_forex | earnings | ipo | economy
#   weight     1-5 (5 = official exchange/regulatory announcement, major market impact)
#   include / exclude   optional regexes on titles
#   max_age_days        ignore entries older than this (default 14)
#   enabled    set false to mute a source without deleting it

